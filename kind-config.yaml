kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jev

# Cilium mounts bpffs and loads eBPF into the shared host kernel, which
# needs real host capabilities kind/podman don't have under rootless
# Podman — this cluster is created with `sudo` (rootful Podman). See the
# `cluster`/`destroy` Makefile targets and CLAUDE.md.

networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
  disableDefaultCNI: true # Cilium replaces the default kindnet CNI
  kubeProxyMode: "none" # Cilium runs in full kube-proxy replacement mode

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  - role: worker

  - role: worker
