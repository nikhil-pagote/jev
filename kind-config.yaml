kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Podman users: export KIND_EXPERIMENTAL_PROVIDER=podman (see .envrc)
# Docker users: no extra env needed

networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
  disableDefaultCNI: true # Cilium replaces the default kindnet CNI
  kubeProxyMode: "none" # Cilium runs in full kube-proxy replacement mode

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  - role: worker

  - role: worker
