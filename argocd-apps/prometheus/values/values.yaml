server:
  persistentVolume:
    size: 4Gi
  retention: "6h" # short retention — this is a POC, not a long-lived cluster
  # --web.route-prefix=/prometheus so Prometheus's own internal redirects
  # (e.g. "/" -> "/query") are prefix-aware. Path-only, no host needed —
  # matches the "don't strip, app handles its own subpath" pattern used
  # for Grafana/Jaeger/ArgoCD (see argocd-apps/ingress-routes/routes.yaml).
  prefixURL: /prometheus
  # Chart default is 1m, too coarse for dashboards' short rate()/irate()
  # windows (e.g. Grafana's $__interval, often well under a minute on a
  # 15m-range panel) — confirmed live: with a 1m scrape interval, those
  # queries only ever see 0-1 real samples in their lookback window,
  # so rate() has nothing to compute a slope from and returns no data,
  # even though the underlying counter itself is scraped and present.
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

# Out of scope for this POC — no alert routing configured.
alertmanager:
  enabled: false

# CoreDNS is already scraped generically via kubernetes-service-endpoints
# auto-discovery, but that job always reports job="kubernetes-service-endpoints"
# regardless of which service it found. The community "CoreDNS" Grafana
# dashboard (grafana.com ID 14981) hardcodes job="coredns" in its $instance
# variable query — a convention from kube-prometheus-stack's auto-created
# ServiceMonitor, which this repo doesn't use. This dedicated job exists
# only to satisfy that one dashboard; CoreDNS ends up scraped twice
# (harmless, same precedent as pod-annotation + service-endpoint scraping
# running in parallel elsewhere).
extraScrapeConfigs: |
  - job_name: coredns
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [kube-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        regex: kube-dns
        action: keep
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        regex: metrics
        action: keep
