# Single-binary, filesystem-backed deployment — no object storage / minio
# needed, matching the "single-binary, filesystem storage" pattern for a POC.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

# SimpleScalable/Distributed-only components — the chart still defaults
# these to 3 replicas each even in SingleBinary mode, which its own
# validate.yaml rejects ("more than zero replicas configured for both the
# single binary and simple scalable targets") — zero them out explicitly.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
minio:
  enabled: false
gateway:
  enabled: false
test:
  enabled: false
