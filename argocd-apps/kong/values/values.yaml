# DB-less (env.database: "off" is already this chart's own default —
# listed here only for clarity, not to override anything). Kong's own
# Helm automation for admin_gui_listen is still gated behind the legacy
# `enterprise.enabled` flag even though Kong Gateway 3.9 itself supports
# OSS Kong Manager natively (verified by reading
# templates/_helpers.tpl in the vendored chart) — so it's set directly
# here instead of via enterprise.enabled, which would pull in unrelated
# enterprise-only templating we don't want or have a license for.
env:
  database: "off"
  admin_gui_listen: "0.0.0.0:8002"
  # Kong's own tracing instrumentation defaults to "off" (confirmed via
  # Admin API: opentelemetry_tracing = ['off']), independent of the
  # opentelemetry KongClusterPlugin being attached and correctly
  # configured — with it off, Kong generates no spans at all, so the
  # plugin has nothing to export. "all" turns on span generation for
  # every request phase. (opentelemetry_tracing is the deprecated Kong
  # 3.9 name for this setting — tracing_instrumentations is current.)
  tracing_instrumentations: "all"
  # Kong's global tracing sampling rate defaults to 0.01 (1%), so 99% of
  # requests through the gateway produce no span even with
  # instrumentation on. The design spec requires every request to get a
  # span, so sample everything.
  tracing_sampling_rate: "1"

ingressController:
  enabled: true

proxy:
  type: NodePort
  http:
    nodePort: 30080
  tls:
    enabled: false

admin:
  enabled: true
  http:
    enabled: true
    # Kong Manager's kconfig.js falls back to
    # window.location.hostname + ADMIN_API_PORT, where ADMIN_API_PORT
    # reflects Kong's actual admin_listen port (driven by this
    # containerPort — see templates/_helpers.tpl KONG_ADMIN_LISTEN and
    # kong.adminLocalURL). Setting the container port equal to the
    # NodePort makes that fallback resolve correctly without a
    # hardcoded node IP, which would go stale if the cluster is
    # recreated with a new node IP.
    containerPort: 30001
    nodePort: 30001
  tls:
    enabled: false

manager:
  http:
    nodePort: 30002
  tls:
    enabled: false

# Developer Portal — unused, don't stand up its NodePort Service.
portal:
  enabled: false

# Picked up by the Prometheus chart's default kubernetes-pods scrape
# job (confirmed in argocd-apps/prometheus/chart/values.yaml) — same
# pattern already used for the OTel Collector in this repo. Kong's
# status listener (container port 8100) is always on by default.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8100"
