adminUser: admin
adminPassword: admin123

grafana.ini:
  server:
    domain: localhost
    root_url: "%(protocol)s://%(domain)s:30080/grafana/"
    serve_from_sub_path: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # Prometheus runs with --web.route-prefix=/prometheus (see
        # argocd-apps/prometheus/values/values.yaml) — every API path,
        # not just the web UI, requires this prefix, or Grafana's
        # queries 404.
        url: http://prometheus-server.observability.svc.cluster.local:80/prometheus
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100

# Dashboards to auto-provision from grafana.com, so re-adding them isn't
# a manual UI step after every fresh cluster. The chart downloads each
# by gnetId/revision into an initContainer-mounted volume at deploy time.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    k8s-dashboard:
      gnetId: 15661
      revision: 2
      # This dashboard's panels all reference "${DS__VICTORIAMETRICS-PROD-ALL}"
      # (baked in by its author against their own setup), not the
      # standard "${DS_PROMETHEUS}" — a plain `datasource: Prometheus`
      # string does nothing here, since the chart's substitution only
      # matches that one standard name. List form does a literal
      # find/replace of the exact placeholder instead.
      datasource:
        - name: DS__VICTORIAMETRICS-PROD-ALL
          value: Prometheus
