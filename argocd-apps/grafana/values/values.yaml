adminUser: admin
adminPassword: admin123

grafana.ini:
  server:
    domain: localhost
    root_url: "%(protocol)s://%(domain)s:30080/grafana/"
    serve_from_sub_path: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # Prometheus runs with --web.route-prefix=/prometheus (see
        # argocd-apps/prometheus/values/values.yaml) — every API path,
        # not just the web UI, requires this prefix, or Grafana's
        # queries 404.
        url: http://prometheus-server.observability.svc.cluster.local:80/prometheus
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
