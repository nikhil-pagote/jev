# daemonset (not deployment) so the hostMetrics preset below reports
# real per-node stats from every node, not just whichever one a single
# Deployment pod happens to land on.
mode: daemonset

# kind's control-plane node has the standard NoSchedule taint — without
# this the DaemonSet would only run on the 2 worker nodes.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# contrib image needed for the "prometheus" exporter (metrics fan-out)
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

# Picked up by the Prometheus chart's default kubernetes-pods scrape job.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8889"

# Adds the hostmetrics receiver (cpu/load/memory/disk/filesystem/network
# scrapers) to the metrics pipeline below, plus the read-only hostPath
# mount (/ -> /hostfs) it needs. No hostNetwork/hostPID required — those
# only matter for process-level scraping, which isn't part of this
# preset's scraper list.
presets:
  hostMetrics:
    enabled: true

config:
  processors:
    # hostmetrics doesn't set service.namespace itself, but the
    # "OpenTelemetry Collector HostMetrics" Grafana dashboard
    # (grafana.com ID 20376) requires it to populate its $service_namespace
    # variable. Applies to the whole metrics pipeline — fine today since
    # nothing else flows through it yet; would need its own sub-pipeline
    # if a real app's OTLP metrics should NOT get this label later.
    resource/hostmetrics:
      attributes:
        - key: service.namespace
          value: jev
          action: upsert
  exporters:
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # Loki 3.x+ native OTLP logs endpoint — no dedicated "loki" exporter needed.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true
    prometheus:
      endpoint: ${env:MY_POD_IP}:8889
      # Without this, OTel resource attributes (host.name, our
      # service.namespace=jev, etc.) never become Prometheus labels —
      # confirmed live: every hostmetrics series had zero such labels
      # until this was added.
      resource_to_telemetry_conversion:
        enabled: true
      # Without this, system.cpu.time (a counter, unit "s") exports as
      # system_cpu_time_seconds_total — confirmed live. The OTel
      # HostMetrics dashboard (grafana.com ID 20376) expects the bare
      # "system_cpu_time" name throughout.
      add_metric_suffixes: false

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resource/hostmetrics, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
