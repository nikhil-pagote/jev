# daemonset (not deployment) so the hostMetrics preset below reports
# real per-node stats from every node, not just whichever one a single
# Deployment pod happens to land on.
mode: daemonset

# kind's control-plane node has the standard NoSchedule taint — without
# this the DaemonSet would only run on the 2 worker nodes.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule

# Needed for the "process" scraper below (per-process CPU/memory/disk
# breakdown) to see every process on the node, not just its own
# container's PID namespace. Deliberately NOT enabled earlier in this
# setup — this is a real privilege increase, added only on explicit
# request once host/network-level metrics alone weren't enough.
hostPID: true

# contrib image needed for the "prometheus" exporter (metrics fan-out)
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

# Picked up by the Prometheus chart's default kubernetes-pods scrape job.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8889"

# Adds the hostmetrics receiver (cpu/load/memory/disk/filesystem/network
# scrapers) to the metrics pipeline below, plus the read-only hostPath
# mount (/ -> /hostfs) it needs. No hostNetwork/hostPID required — those
# only matter for process-level scraping, which isn't part of this
# preset's scraper list.
presets:
  hostMetrics:
    enabled: true

config:
  receivers:
    hostmetrics:
      # system.memory.utilization and system.filesystem.utilization are
      # disabled by default on their scrapers — confirmed live, absent
      # from the exporter output otherwise — but the dashboard's RAM/FS
      # panels need them. Merges with (doesn't replace) the hostMetrics
      # preset's own filesystem exclude_mount_points/exclude_fs_types.
      scrapers:
        memory:
          metrics:
            system.memory.utilization:
              enabled: true
        filesystem:
          metrics:
            system.filesystem.utilization:
              enabled: true
        # Not part of the hostMetrics preset's default scraper list at
        # all — needed for the dashboard's SWAP panel.
        paging:
          metrics:
            system.paging.utilization:
              enabled: true
        # Also not in the preset's default list — needed for the
        # dashboard's CPU/Memory Stack/Disk I/O Utilization panels.
        # Requires hostPID (set above) to see every process on the
        # node. mute_process_*_error avoids noisy errors for the
        # ordinary case of a process exiting between the scraper
        # listing PIDs and reading each one's /proc entry.
        process:
          # Like system.memory.utilization earlier, process.cpu.utilization
          # is disabled by default — the scraper only emits the raw
          # process.cpu.time counter otherwise.
          metrics:
            process.cpu.utilization:
              enabled: true
          mute_process_name_error: true
          mute_process_exe_error: true
          mute_process_io_error: true
  processors:
    # The hostmetrics receiver doesn't set host.name itself — confirmed
    # live, absent from every series otherwise — but the dashboard's
    # $host variable needs it to populate.
    resourcedetection/system:
      detectors: [system]
      system:
        hostname_sources: [os]
    # hostmetrics doesn't set service.namespace itself, but the
    # "OpenTelemetry Collector HostMetrics" Grafana dashboard
    # (grafana.com ID 20376) requires it to populate its $service_namespace
    # variable. Applies to the whole metrics pipeline — fine today since
    # nothing else flows through it yet; would need its own sub-pipeline
    # if a real app's OTLP metrics should NOT get this label later.
    resource/hostmetrics:
      attributes:
        - key: service.namespace
          value: jev
          action: upsert
  exporters:
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # Loki 3.x+ native OTLP logs endpoint — no dedicated "loki" exporter needed.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true
    prometheus:
      endpoint: ${env:MY_POD_IP}:8889
      # Without this, OTel resource attributes (host.name, our
      # service.namespace=jev, etc.) never become Prometheus labels —
      # confirmed live: every hostmetrics series had zero such labels
      # until this was added.
      resource_to_telemetry_conversion:
        enabled: true
      # add_metric_suffixes: false was tried here and had zero effect
      # (confirmed live) — this collector version (0.160.0) still
      # exports e.g. system.cpu.time as system_cpu_time_seconds_total
      # regardless. The Grafana dashboard provisioning
      # (argocd-apps/grafana/values/values.yaml) rewrites the
      # dashboard's queries to match these real names instead, rather
      # than fighting the exporter.

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resourcedetection/system, resource/hostmetrics, batch]
        exporters: [prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/loki]
