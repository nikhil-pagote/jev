# The one manual `kubectl apply`. From here on, ArgoCD watches argocd-apps/
# in this repo continuously — new commits (a new <app>/app.yaml, an edited
# values.yaml) are picked up and reconciled automatically, no further
# manual apply needed.
#
# Every child (traefik, prometheus, grafana, loki, jaeger,
# opentelemetry-collector, ingress-routes) follows the same `<app>/app.yaml`
# shape, so root's own manifest set is always just `Application` objects —
# a kind the API server always recognizes. CRD-dependent raw resources
# (Traefik's IngressRoute/Middleware) live in their own child Application
# (ingress-routes) instead of being folded directly into root: bundling
# them here made ArgoCD fail resource discovery for root's *entire* sync
# before even applying the traefik Application that installs those CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikhil-pagote/jev.git
    targetRevision: HEAD
    path: argocd-apps
    directory:
      recurse: true
      include: "*/app.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
