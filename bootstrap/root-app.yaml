# The one manual `kubectl apply`. From here on, ArgoCD watches argocd-apps/
# in this repo continuously — new commits (a new app.yaml, an edited
# values.yaml, a change to ingress-routes.yaml) are picked up and
# reconciled automatically, no further manual apply needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikhil-pagote/jev.git
    targetRevision: HEAD
    path: argocd-apps
    directory:
      recurse: true
      # Allowlist, not a denylist: vendored charts are an open-ended tree
      # (e.g. grafana/chart/ci/*.yaml ships test-fixture "values" files that
      # aren't valid manifests) — safer to name exactly what we want than to
      # try to exclude everything we don't.
      include: "{*/app.yaml,ingress-routes.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
